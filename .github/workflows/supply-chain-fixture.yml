# 이슈 #36 네거티브 픽스처. workflow_dispatch로 수동 실행해야 한다.
#
# 실행 이력 (2026-09-17):
# - run 35191348120 (최초): red. cargo build가 루트 rust-toolchain.toml의 채널
#   1.98.0을 rustup으로 동기화하려다 static.rust-lang.org가 막혀 죽음 — example.com
#   프로브에는 도달하지 못했다.
# - run 35191601144/35191785632: main 스텝 순서에서 checkout·툴체인 설치를
#   harden-runner "uses" 스텝보다 앞에 둬도 여전히 실패. harden-runner의 실제 차단은
#   그 액션의 pre 훅에서 잡 시작 시점(모든 pre 훅이 main 스텝들보다 먼저 일괄 실행됨)에
#   걸리기 때문에, main 스텝 순서 재배치로는 차단 시점을 늦출 수 없다 — GitHub Actions의
#   pre/main 실행 모델상 당연한 결과였다.
# → 올바른 해법은 순서 변경이 아니라 rustup 툴체인 다운로드에 필요한
#   static.rust-lang.org를 허용 목록에 추가하는 것이다. example.com은 여전히
#   포함하지 않는다 — 이 픽스처가 증명하려는 것은 "example.com이 도달 불가능하다"는
#   것뿐이고, 툴체인 배포 도메인 허용은 그 목적을 약화시키지 않는다.
#
# 실행 후 green이면 fixture crate의 build.rs가 example.com 연결 실패를 감지했다는
# 뜻이고, red면 차단이 작동하지 않는다는 뜻이다.
name: Supply Chain Egress Fixture

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      # 필요한 최소 엔드포인트만 허용한다: github.com:443(체크아웃; step-security/
      # harden-runner 리포 자체의 도그푸딩 CI에서 실측된 값)과 static.rust-lang.org:443
      # (rust-toolchain.toml이 고정한 1.98.0 채널을 rustup이 받아오는 데 필요).
      # example.com은 절대 포함하지 않는다 — 이 픽스처의 핵심은 example.com이
      # 반드시 도달 불가능해야 한다는 것이다.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 허용한 github.com:443 자체가 닿는지 먼저 확인한다. 이 단계가 없으면 전체
      # 네트워크 장애도 build.rs의 example.com 실패와 같은 green으로 오인할 수 있다.
      - name: Verify permitted GitHub egress
        run: curl --fail --silent --show-error --connect-timeout 10 https://github.com/
      - name: Build egress probe (must succeed = egress blocked)
        run: cargo build --manifest-path fixtures/build-script-egress-probe/Cargo.toml
