name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 빌드 스텝(pnpm install, cargo/tauri build, trivy, SBOM 생성 등)이 공급망 공격의
  # 실제 표적이다 — 이 job에는 릴리스 생성 권한을 주지 않는다(contents: read).
  # persist-credentials: false로 체크아웃된 워크스페이스에도 쓰기 가능한
  # 자격증명을 남기지 않는다(GitHub #36, D40).
  build:
    runs-on: macos-14
    permissions:
      contents: read
    # 컨텍스트 값은 run 셸에 직접 보간하지 않고 env로 넘긴다(인젝션 방지 관행).
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # 이 리포는 이제 origin에 push되어 실제 CI가 돈다 — 하지만 아직 egress
      # baseline을 몇 차례 수집한 적이 없어 audit(로깅만)으로 시작한다. 몇 번의
      # 실제 실행 로그를 검토한 뒤 block으로 승격한다(#36, D40).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3
      - run: pnpm install --frozen-lockfile
      # 라이선스 정책 게이트를 빌드 앞에 둔다 — 정책 위반이면 릴리스가 나가기 전에
      # 멈춰야 한다(이슈 #9 "incomplete SBOM/license inventory는 release FAIL").
      - name: License policy gate
        run: |
          ./scripts/release/check_licenses.sh --self-test
          ./scripts/release/check_licenses.sh
      # 취약점 게이트는 릴리스에만 둔다 — trivy 취약점 DB는 네트워크를 타므로
      # make verify(폐쇄망에서도 돌아야 한다)에 넣으면 오프라인 개발이 깨진다.
      # 라이선스 게이트가 lockfile만 보는 것과 다른 점이다(이슈 #35).
      - name: Vulnerability gate (HIGH/CRITICAL)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --skip-version-check .
      # RUSTSEC 권고/yanked/미승인 소스 게이트 — trivy는 취약점만 보고 yanked나
      # 미승인 registry/git 소스는 못 본다(이슈 #36). EmbarkStudios/cargo-deny-action은
      # Docker container action이라 GitHub 정책상 Linux 러너에서만 실행 가능하고
      # 이 job은 macos-14라 실행할 수 없다(공식 문서 확인) — 대신 cargo-deny를
      # 직접 설치해 Makefile의 supply-chain-check와 동일한 검사를 수행한다.
      #
      # report-only(continue-on-error)로 두는 이유(D40, 실측 2026-09-08): 도입
      # 시점에 이미 존재하던 findings(tauri-utils → urlpattern → unic-* 경로의
      # unmaintained 5건 — 전부 Tauri 자체의 전이 의존성, 현재 안전한 업그레이드
      # 없음)가 있어 지금 바로 hard-block하면 이 리포가 만든 적 없는 원인으로
      # 릴리스가 항상 막힌다. 각 finding의 실제 도달 가능성(공격자 제어 입력이 그
      # 경로를 타는지)을 심사한 뒤 hard-block으로 승격하는 것이 후속 작업이다 —
      # 이 게이트를 "통과 안 해도 되는 장식"으로 만들려는 게 아니라, 검증 없는
      # block이 harden-runner에서도 피한 것과 같은 실수(#36 자체 기준)이기 때문이다.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Supply-chain gate (advisories/yanked/unapproved sources) — report-only, see D40
        continue-on-error: true
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories sources
      # .dmg 번들 단계는 헤드리스 세션에서 Finder AppleScript 대기로 멈춘다(README
      # "빌드 / 패키징" 절 실측) — 릴리스 산출물은 .app을 zip으로 배포한다.
      - run: pnpm tauri build --bundles app
      # 서드파티 고지는 lockfile에서 릴리스 시점에 도출한다 — 커밋해두면 어긋난다.
      - name: Generate third-party notices
        run: ./scripts/release/gen_third_party_notices.sh
      # SBOM도 같은 이유로 커밋하지 않는다 — 이 태그의 Cargo.lock/pnpm-lock.yaml에서
      # 매 릴리스 직접 도출한다(NOTICE 파일 "SBOM" 절 참고).
      - name: Generate SBOM
        run: ./scripts/release/gen_sbom.sh
      - name: Zip app bundle with notices
        run: |
          mkdir -p stage
          cp -R src-tauri/target/release/bundle/macos/KubeMetal.app stage/
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md sbom-cyclonedx.json sbom-spdx.json stage/
          # 체크섬은 zip에 들어가는 모든 파일(.app 번들 내부 바이너리 포함)을
          # 대상으로 한다. stage 안에 바로 `> SHA256SUMS.txt`로 쓰면 셸이 find
          # 실행 전에 그 파일을 미리 만들어 find 결과에 자기 자신이 잡히므로,
          # stage 밖에 먼저 쓰고 이동한다. macos-14 러너이므로 shasum -a 256
          # 사용(macOS 기본 제공, Linux에서도 동일하게 동작).
          (cd stage && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .)
          # SHA256SUMS.txt에서 이미 계산한 .app 내부 파일의 정렬된 레코드를 다시
          # 해시해 번들 전체를 나타내고, SBOM/고지의 해시와 함께 단일 파일에 남긴다.
          # 원본 번들 파일은 재해시하지 않는다.
          release_tag="$TAG"
          version="${release_tag#v}"
          checksum() {
            awk -v path="$1" '$2 == path { print $1; exit }' stage/SHA256SUMS.txt
          }
          app_bundle_sha256="$(awk '$2 ~ /^\.\/KubeMetal\.app\// { print }' stage/SHA256SUMS.txt | shasum -a 256 | awk '{ print $1 }')"
          cyclonedx_sha256="$(checksum ./sbom-cyclonedx.json)"
          spdx_sha256="$(checksum ./sbom-spdx.json)"
          notices_sha256="$(checksum ./THIRD-PARTY-NOTICES.md)"
          [ -n "$app_bundle_sha256" ] && [ -n "$cyclonedx_sha256" ] && [ -n "$spdx_sha256" ] && [ -n "$notices_sha256" ]
          RELEASE_TAG="$release_tag" VERSION="$version" APP_BUNDLE_SHA256="$app_bundle_sha256" CYCLONEDX_SHA256="$cyclonedx_sha256" SPDX_SHA256="$spdx_sha256" NOTICES_SHA256="$notices_sha256" python3 - <<'PY' > stage/release-manifest.json
          import json
          import os

          json.dump({
              "release_tag": os.environ["RELEASE_TAG"],
              "version": os.environ["VERSION"],
              "app_bundle": {
                  "filename": "KubeMetal.app",
                  "sha256": os.environ["APP_BUNDLE_SHA256"],
                  "digest_source": "sha256 of sorted SHA256SUMS.txt records for files under KubeMetal.app/",
              },
              "sboms": [
                  {"filename": "sbom-cyclonedx.json", "sha256": os.environ["CYCLONEDX_SHA256"]},
                  {"filename": "sbom-spdx.json", "sha256": os.environ["SPDX_SHA256"]},
              ],
              "license_reports": [
                  {"filename": "THIRD-PARTY-NOTICES.md", "sha256": os.environ["NOTICES_SHA256"]},
              ],
          }, __import__("sys").stdout, indent=2)
          print()
          PY
          ditto -c -k stage "KubeMetal-${TAG}-aarch64.zip"
      # 릴리스에 첨부할 산출물만 다음 job(publish, contents: write)으로 넘긴다 —
      # 이 job 자체는 릴리스 생성 권한이 없다(GitHub #36, D40).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            KubeMetal-${{ github.ref_name }}-aarch64.zip
            stage/SHA256SUMS.txt
            stage/release-manifest.json
          if-no-files-found: error

  # build job이 만든 산출물을 받아 GitHub 릴리스를 생성하기만 한다 — 빌드 스텝
  # 전체는 이 권한을 갖지 않는다(GitHub #36, D40). 아티팩트 자체는 OS 무관이지만
  # 이번 스코프는 변경 최소화를 위해 macos-14로 통일한다.
  publish:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # publish job은 checkout을 하지 않는다(코드를 받을 필요가 없다) — gh는
          # 보통 로컬 git remote로 대상 저장소를 추론하는데, checkout이 없으면
          # 그 추론이 불가능해 실패한다. GH_REPO로 명시해 checkout 없이도 동작하게 한다.
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG"
          --title "KubeMetal $TAG"
          --generate-notes
          --notes "> CI 빌드는 서명되지 않은 .app입니다. 첫 실행은 우클릭 → 열기
          또는 \`xattr -cr KubeMetal.app\`이 필요하며, LAN 클러스터 접근(로컬
          네트워크 권한)은 안정된 코드 서명이 있어야 유지됩니다 — README의 서명
          절을 참고해 \`make app\`으로 직접 빌드하는 것을 권장합니다."
          "KubeMetal-${TAG}-aarch64.zip"
