name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    # 컨텍스트 값은 run 셸에 직접 보간하지 않고 env로 넘긴다(인젝션 방지 관행).
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install  # 버전·컴포넌트는 rust-toolchain.toml 하나에서만 읽는다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3
      - run: pnpm install --frozen-lockfile
      # 라이선스 정책 게이트를 빌드 앞에 둔다 — 정책 위반이면 릴리스가 나가기 전에
      # 멈춰야 한다(이슈 #9 "incomplete SBOM/license inventory는 release FAIL").
      - name: License policy gate
        run: |
          ./scripts/release/check_licenses.sh --self-test
          ./scripts/release/check_licenses.sh
      # 취약점 게이트는 릴리스에만 둔다 — trivy 취약점 DB는 네트워크를 타므로
      # make verify(폐쇄망에서도 돌아야 한다)에 넣으면 오프라인 개발이 깨진다.
      # 라이선스 게이트가 lockfile만 보는 것과 다른 점이다(이슈 #35).
      - name: Vulnerability gate (HIGH/CRITICAL)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --skip-version-check .
      # .dmg 번들 단계는 헤드리스 세션에서 Finder AppleScript 대기로 멈춘다(README
      # "빌드 / 패키징" 절 실측) — 릴리스 산출물은 .app을 zip으로 배포한다.
      - run: pnpm tauri build --bundles app
      # 서드파티 고지는 lockfile에서 릴리스 시점에 도출한다 — 커밋해두면 어긋난다.
      - name: Generate third-party notices
        run: ./scripts/release/gen_third_party_notices.sh
      # SBOM도 같은 이유로 커밋하지 않는다 — 이 태그의 Cargo.lock/pnpm-lock.yaml에서
      # 매 릴리스 직접 도출한다(NOTICE 파일 "SBOM" 절 참고).
      - name: Generate SBOM
        run: ./scripts/release/gen_sbom.sh
      - name: Stage release assets and generate manifest
        run: |
          mkdir -p stage
          cp -R src-tauri/target/release/bundle/macos/KubeMetal.app stage/
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md sbom-cyclonedx.json sbom-spdx.json stage/
          ditto -c -k stage "KubeMetal-${TAG}-aarch64.zip"
          rm -rf stage/KubeMetal.app
          mv "KubeMetal-${TAG}-aarch64.zip" stage/
          ./scripts/release/gen_release_manifest.sh stage "$TAG"
          ./scripts/release/gen_release_manifest.sh --verify stage/release-manifest.json stage
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          --title "KubeMetal $TAG"
          --generate-notes
          --notes "> CI 빌드는 서명되지 않은 .app입니다. 첫 실행은 우클릭 → 열기
          또는 \`xattr -cr KubeMetal.app\`이 필요하며, LAN 클러스터 접근(로컬
          네트워크 권한)은 안정된 코드 서명이 있어야 유지됩니다 — README의 서명
          절을 참고해 \`make app\`으로 직접 빌드하는 것을 권장합니다."
          "stage/KubeMetal-${TAG}-aarch64.zip"
          "stage/release-manifest.json"
