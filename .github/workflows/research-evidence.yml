name: Research evidence

# D4: Path filtering avoids slowing unrelated PRs. Other changes do not run
# this gate automatically; run make research-check manually when needed.
on:
  push:
    paths:
      - 'research/**'
      - 'scripts/research/**'
  pull_request:
    paths:
      - 'research/**'
      - 'scripts/research/**'

permissions:
  contents: read

jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install 'jsonschema==4.25.1'
      - name: Validate research evidence
        run: make research-check
