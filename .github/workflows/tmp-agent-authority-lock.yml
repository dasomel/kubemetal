name: Temporary Agent Authority Lockfile

on:
  push:
    branches: [feat/agent-execution-authority-contract]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/agent-execution-authority-contract
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Refresh lockfile and verify security contract
        run: |
          set -euo pipefail
          cd src-tauri
          cargo check
          cargo test agent_execution_security
          cd ..
          git diff --check
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock
          git commit -m 'chore(deps): lock agent authority hashing dependency'
          git push origin HEAD:feat/agent-execution-authority-contract
