# make verify(테스트 + clippy + tsc + 디자인 린트 + 웹 빌드)를 그대로 실행한다 —
# 게이트 정의는 Makefile이 정본이고, CI가 따로 명령을 들고 있으면 둘이 어긋난다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Apple Silicon 전용 앱 — arm64 macOS 러너에서만 의미 있는 검증이다.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install  # 버전·컴포넌트는 rust-toolchain.toml 하나에서만 읽는다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Verify (test + rustfmt/clippy/tsc lint + DESIGN.md lint + license + web build)
        run: make verify

  supply-chain:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install  # 버전·컴포넌트는 rust-toolchain.toml 하나에서만 읽는다
      # GitHub API로 cargo-deny-action SHA를 확인할 수 없는 환경에서도 action ref를
      # 추측해 고정하지 않는다. --locked 설치로 동일 정책 검사를 재현한다.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Supply-chain policy gate
        run: make supply-chain-check
