apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-data
  namespace: default
spec:
  # storageClassName은 의도적으로 생략 — 대상 클러스터의 기본 StorageClass를 따른다.
  # colima k3s는 local-path, narwhal은 nfs-csi가 각각 default로 지정돼 있다(2026-07-26 실측).
  # 기본 SC가 없는 클러스터에서는 render.sh의 STORAGE_CLASS로 주입한다(D26).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect
  namespace: default
  labels:
    app: prefect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect
  template:
    metadata:
      labels:
        app: prefect
        # selector(matchLabels)는 불변 필드라 `app:`을 그대로 두고 여기에만 덧붙인다.
        # 외부 클러스터의 Kyverno `require-labels`가 파드에 이 라벨을 요구한다(D26 실측).
        app.kubernetes.io/name: prefect
    spec:
      containers:
        - name: prefect
          # 태그 3.7.8-python3.12는 2026-07-23 Docker Hub API(hub.docker.com/v2/repositories/
          # prefecthq/prefect/tags)로 실존 확인한 최신 안정 릴리스(3-latest 별칭과 동일 다이제스트).
          # 레지스트리를 명시한다 — Kyverno `restrict-image-registries`는 `docker.io/*`만 승인.
          image: docker.io/prefecthq/prefect:3.7.8-python3.12
          command: ["prefect", "server", "start", "--host", "0.0.0.0"]
          env:
            # PREFECT_HOME 하위에 SQLite DB(prefect.db)가 생성되므로 PVC를 여기에 마운트해야
            # 파드 재시작 후에도 플로우/배포 메타데이터가 유지된다.
            - name: PREFECT_HOME
              value: /data
          ports:
            - containerPort: 4200
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: prefect-data
              mountPath: /data
      volumes:
        - name: prefect-data
          persistentVolumeClaim:
            claimName: prefect-data
---
apiVersion: v1
kind: Service
metadata:
  name: prefect
  namespace: default
spec:
  selector:
    app: prefect
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 4200
