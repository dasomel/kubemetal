apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-data
  namespace: default
spec:
  # storageClassName은 의도적으로 생략 — 대상 클러스터의 기본 StorageClass를 따른다.
  # colima k3s는 local-path, narwhal은 nfs-csi가 각각 default로 지정돼 있다(2026-07-26 실측).
  # 기본 SC가 없는 클러스터에서는 render.sh의 STORAGE_CLASS로 주입한다(D26).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect
  namespace: default
  labels:
    app: prefect
spec:
  replicas: 1
  # RollingUpdate(기본값)는 새 파드를 옛 파드가 RWO PVC를 놓기 전에 띄운다. 그 상태에서는
  # kubelet이 fsGroup 65532로 볼륨을 재소유(chown)하지 않는다 — 이미 다른 파드가 마운트한
  # 볼륨의 그룹 소유권을 바꾸지 않는 게 kubelet의 의도된 동작이다(D38 실측: "AlreadyMounted
  # Volume ... GID 0" 경고 후 sqlite "attempt to write a readonly database"로 크래시루프).
  # Recreate로 바꿔 옛 파드 종료 → PVC 반납 → 새 파드가 단독으로 마운트해 fsGroup이
  # 실제로 적용되게 한다. 단일 레플리카 + 배타적 PVC 조합에서는 어차피 동시 실행이 불가능
  # 했으므로 가용성 손실은 없다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prefect
  template:
    metadata:
      labels:
        app: prefect
        # selector(matchLabels)는 불변 필드라 `app:`을 그대로 두고 여기에만 덧붙인다.
        # 외부 클러스터의 Kyverno `require-labels`가 파드에 이 라벨을 요구한다(D26 실측).
        app.kubernetes.io/name: prefect
    spec:
      # D38 보안 베이스라인: mlflow-deployment.yaml과 동일한 근거로 65532 고정.
      # fsGroup이 PVC(prefect-data)도 65532 그룹 소유로 맞춰준다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 기존 클러스터에서 root(0:0)로 생성된 PVC(/data) 소유권을 65532로 1회 마이그레이션한다.
        # kubelet fsGroup은 이미 존재하는 파일들의 소유권을 소급 변경하지 못해 sqlite3
        # readonly 에러가 발생하므로, root 권한으로 실행되는 유일한 예외 컨테이너로 선언한다.
        # 앱 컨테이너는 non-root(65532)를 엄격히 유지하며, 이 작업은 멱등(idempotent)하다.
        - name: volume-permissions
          image: docker.io/prefecthq/prefect:3.7.8-python3.12
          command:
            - sh
            - -c
            - "chown -R 65532:65532 /data && chmod -R g+rwX /data"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: prefect-data
              mountPath: /data
      containers:
        - name: prefect
          # 태그 3.7.8-python3.12는 2026-07-23 Docker Hub API(hub.docker.com/v2/repositories/
          # prefecthq/prefect/tags)로 실존 확인한 최신 안정 릴리스(3-latest 별칭과 동일 다이제스트).
          # 레지스트리를 명시한다 — Kyverno `restrict-image-registries`는 `docker.io/*`만 승인.
          image: docker.io/prefecthq/prefect:3.7.8-python3.12
          command: ["prefect", "server", "start", "--host", "0.0.0.0"]
          env:
            # PREFECT_HOME 하위에 SQLite DB(prefect.db)가 생성되므로 PVC를 여기에 마운트해야
            # 파드 재시작 후에도 플로우/배포 메타데이터가 유지된다.
            - name: PREFECT_HOME
              value: /data
            # readOnlyRootFilesystem 하에서 site-packages 안에 UI 정적 파일을 다시
            # 빌드하려다 실패한다(root 소유 디렉터리에 65532가 못 씀 — Permission denied,
            # 심지어 리드온리가 아니어도 마찬가지로 실측). PREFECT_UI_STATIC_DIRECTORY를
            # 쓰기 가능한 /tmp로 돌리면 UI가 정상 렌더된다(HTTP 200, 실측). HOME=/data는
            # 이미 마운트된 PVC를 재사용해 새 쓰기 경로를 늘리지 않는다.
            - name: HOME
              value: /data
            - name: PREFECT_UI_STATIC_DIRECTORY
              value: /tmp/prefect-ui
          ports:
            - containerPort: 4200
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: prefect-data
              mountPath: /data
            - name: prefect-tmp
              mountPath: /tmp
      volumes:
        - name: prefect-data
          persistentVolumeClaim:
            claimName: prefect-data
        - name: prefect-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prefect
  namespace: default
spec:
  selector:
    app: prefect
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 4200
