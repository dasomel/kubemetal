apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
  namespace: default
  labels:
    app: seaweedfs
type: Opaque
# SeaweedFS 무인증 모드용 플레이스홀더 — 실제 비밀 아님.
# SeaweedFS S3 게이트웨이는 IAM 미설정 시 어떤 자격증명이든 수락하므로,
# 아래 값은 boto3/MLflow S3 클라이언트가 요구하는 필수 헤더를 채우기 위한 더미값이다.
stringData:
  access-key-id: kubemetal
  secret-access-key: kubemetal-local
