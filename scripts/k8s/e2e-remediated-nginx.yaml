apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-broken-nginx
  namespace: default
  labels:
    remediated-by: coding-agent-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-broken-nginx
  template:
    metadata:
      labels:
        app: e2e-broken-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80