apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: default
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      # SeaweedFS S3(무인증)가 뜰 때까지 대기 후 아티팩트 버킷(mlflow)을 보장 생성 (D13/FR-06).
      initContainers:
        - name: ensure-artifact-bucket
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://seaweedfs:8333/ -o /dev/null; do
                echo "waiting for seaweedfs s3..."
                sleep 2
              done
              code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://seaweedfs:8333/mlflow)
              # 200 = created, 409 = already exists (both are success states for "ensure").
              if [ "$code" = "200" ] || [ "$code" = "409" ]; then
                echo "bucket mlflow ensured (http $code)"
              else
                echo "bucket creation failed (http $code)" >&2
                exit 1
              fi
      containers:
        - name: mlflow
          # 태그 v3.14.0은 2026-07-21 ghcr.io/v2/mlflow/mlflow/tags/list로 실존 확인.
          image: ghcr.io/mlflow/mlflow:v3.14.0
          # 이미지에 boto3 미포함 → 기동 시 설치 후 서버 실행 (S3 아티팩트 스토어용).
          command:
            - sh
            - -c
            - |
              pip install --quiet boto3 && \
              exec mlflow server \
                --backend-store-uri sqlite:////tmp/mlflow.db \
                --default-artifact-root s3://mlflow/ \
                --host 0.0.0.0 \
                --port 5000
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs:8333
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: secret-access-key
          ports:
            - containerPort: 5000
          # 실측(kubectl top, 2026-07-24, D14): 정상 가동 3일차 RSS 2235Mi/CPU 17m —
          # sqlite 백엔드+아티팩트 프록시 특성상 상시 높음. requests=실사용 근접(스케줄링
          # 안정성), limits=1.4x 헤드룸(런 목록 조회 등 순간 스파이크 대응). kagent A2A
          # 진단(k8s-agent)은 requests/limits 미설정만 정확히 짚었고 kubectl top 툴
          # 부재로 구체값은 못 냈다 — 사람이 재실측해 아래 값 확정(docs/08 참고).
          resources:
            requests:
              memory: 2048Mi
            limits:
              memory: 3072Mi
          volumeMounts:
            - name: mlflow-data
              mountPath: /tmp
      volumes:
        - name: mlflow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: default
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
