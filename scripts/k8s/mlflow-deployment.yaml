apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: default
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        # selector(matchLabels)는 불변 필드라 `app:`을 그대로 두고 여기에만 덧붙인다.
        # 외부 클러스터의 Kyverno `require-labels`가 파드에 이 라벨을 요구한다(D26 실측).
        app.kubernetes.io/name: mlflow
    spec:
      # D38 보안 베이스라인: 파드 전체를 비루트 고정 UID로 강제한다. mlflow/curl 이미지는
      # 둘 다 기본 root(seaweedfs·prefect도 마찬가지)지만 65532(distroless nonroot 관례
      # UID)로 기동됨을 실측 확인했다(docker run --user 65532:65532). fsGroup은 emptyDir
      # 마운트(/tmp)의 그룹 소유권을 65532에 맞춰 준다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # SeaweedFS S3(무인증)가 뜰 때까지 대기 후 아티팩트 버킷(mlflow)을 보장 생성 (D13/FR-06).
      initContainers:
        - name: ensure-artifact-bucket
          # 레지스트리를 명시한다 — 외부 클러스터의 Kyverno `restrict-image-registries`가
          # `docker.io/*` 같은 정규화된 접두사만 승인한다(D26 실측). 짧은 이름은 위반.
          image: docker.io/curlimages/curl:8.21.0
          # curl은 파일을 쓰지 않는다 — readOnlyRootFilesystem 실측 확인(docker run
          # --read-only --user 65532:65532, curl --version 정상).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              until curl -sf http://seaweedfs:8333/ -o /dev/null; do
                echo "waiting for seaweedfs s3..."
                sleep 2
              done
              code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://seaweedfs:8333/mlflow)
              # 200 = created, 409 = already exists (both are success states for "ensure").
              if [ "$code" = "200" ] || [ "$code" = "409" ]; then
                echo "bucket mlflow ensured (http $code)"
              else
                echo "bucket creation failed (http $code)" >&2
                exit 1
              fi
      containers:
        - name: mlflow
          # 태그 v3.14.0은 2026-07-21 ghcr.io/v2/mlflow/mlflow/tags/list로 실존 확인.
          image: ghcr.io/mlflow/mlflow:v3.14.0
          # readOnlyRootFilesystem 하에서 비루트로 pip install하려면 HOME이 쓰기 가능해야
          # 한다. HOME=/tmp + PYTHONUSERBASE=/tmp/pylibs 조합으로 --user 설치가 성공하고
          # (PYTHONPATH 없이도) import가 자동 해석됨을 실측 확인(D38). /tmp는 이미 emptyDir
          # (mlflow-data)로 마운트돼 있어 새 볼륨이 필요 없다.
          command:
            - sh
            - -c
            - |
              HOME=/tmp PYTHONUSERBASE=/tmp/pylibs pip install --user --quiet boto3 && \
              exec mlflow server \
                --backend-store-uri sqlite:////tmp/mlflow.db \
                --default-artifact-root s3://mlflow/ \
                --host 0.0.0.0 \
                --port 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # /tmp(mlflow-data emptyDir)만 쓰기 필요 — sqlite DB, pip --user 설치,
            # boto3 캐시가 모두 거기 산다. readOnlyRootFilesystem 하 실제 서버 기동까지
            # 실측 확인(Application startup complete, UI HTTP 200).
            readOnlyRootFilesystem: true
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs:8333
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: secret-access-key
          ports:
            - containerPort: 5000
          # 실측(kubectl top, 2026-07-24, D14): 정상 가동 3일차 RSS 2235Mi/CPU 17m —
          # sqlite 백엔드+아티팩트 프록시 특성상 상시 높음. requests=실사용 근접(스케줄링
          # 안정성), limits=1.4x 헤드룸(런 목록 조회 등 순간 스파이크 대응). kagent A2A
          # 진단(k8s-agent)은 requests/limits 미설정만 정확히 짚었고 kubectl top 툴
          # 부재로 구체값은 못 냈다 — 사람이 재실측해 아래 값 확정(docs/08 참고).
          resources:
            requests:
              memory: 2048Mi
            limits:
              memory: 3072Mi
          volumeMounts:
            - name: mlflow-data
              mountPath: /tmp
      volumes:
        - name: mlflow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: default
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
