apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: default
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          # 태그 4.40은 2026-07-21 Docker Hub API로 실존 확인(chrislusf/seaweedfs tags).
          image: chrislusf/seaweedfs:4.40
          args:
            - server
            - -dir=/data
            - -s3
            - -filer
          ports:
            - containerPort: 8333
            - containerPort: 8888
            - containerPort: 9333
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
      volumes:
        - name: seaweedfs-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: default
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      protocol: TCP
      port: 8333
      targetPort: 8333
    - name: filer
      protocol: TCP
      port: 8888
      targetPort: 8888
