[package]
name = "kubemetal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "kubemetal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
sysinfo = "0.39"
tauri-plugin-opener = "2"
libc = "0.2"
base64 = "0.22"
# 발열 상태(D2 개정)는 CLI로 읽을 수 없다 — 이 기기 실측(2026-07-27): `pmset -g therm`은
# "No thermal warning level has been recorded", sysctl에 thermal 키 없음, ioreg AppleSMC에
# 온도 항목 0개. 유일한 sudo-free 경로가 NSProcessInfo.thermalState다.
# 두 크레이트 모두 이미 tauri 경유로 트리에 있어 빌드 비용이 늘지 않는다.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
